<div class="profile-container">
    <div class="column-left">
      <button class="back-button" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
        Regresar al chat
      </button>
      <div class="avatar-circle">
        <i class="bi bi-person-fill" style="color: white; font-size: 6rem;"></i>
      </div>
  
      <!-- Botón de Cerrar Sesión -->
      <button class="logout-button" (click)="logout()">
        <i class="bi bi-box-arrow-right" style="margin-right:5px;"></i>
        Cerrar sesión
      </button>
    </div>
  
    <div *ngIf="!anonymous" class="column">
      <h1>{{user.name}} {{user.first_name}} {{user.last_name}}</h1>
      <div class="row-container">
        <div class="row-child">
          <div class="title-tag">
            <i class="bi bi-person" style="color: black; font-size: 1.2rem; margin-right: 5px;"></i>
            Datos de identificación
          </div>
          <p>{{user.field_of_study}}</p>
          <p>{{user.education_level}}</p>
          <div>
            <i class="bi bi-envelope" style="color: black; font-size: 1rem; margin-right: 5px;"></i>
            {{user.email}}
          </div>
  
          <div class="title-tag">
            <i class="bi bi-heart" style="color: black; font-size: 1rem; margin-right: 5px;"></i>
            Preferencias
          </div>
          <p *ngFor="let preference of preferences">
            {{preference}}
          </p>
        </div>
  
        <div class="row-child">
          <div class="title-tag">
            <i class="bi bi-bookmarks" style="color: black; font-size: 1.2rem; margin-right: 5px;"></i>
            Elementos guardados
          </div>
          <strong *ngFor="let item of documents">
            {{item.title}}<br />
          </strong>
          <!-- <p>
            <strong>Crepuscular Bueno</strong><br />
            Prattz González, José Luis (Universidad Autónoma de San Luis Potosí, 2012)
          </p>
          <p>
            <strong>El hombre del arrabal Mejor</strong><br />
            Cancino, Eduardo (Universidad Autónoma de San Luis Potosí, 2012)
          </p> -->
          <button *ngIf="documents[0].title !== 'Sin documentos'" class="see-more-button">Ver más</button>
        </div>
      </div>
    </div>
    <div *ngIf="anonymous" class="column">
      <h1>Usuario Invitado</h1>
    </div>
  </div>
