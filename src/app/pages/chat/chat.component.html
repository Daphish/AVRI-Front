<!-- Solo mostramos el chat si está logueado -->
<div [ngClass]="{ right: isLoggedIn, invisible: !isLoggedIn }">
  <div class="chat-container-space" #chatContainer>
    <div class="chat-container">
      <!-- Pantalla de bienvenida si no hay mensajes -->
      <div *ngIf="messages.length === 0" class="column">
        <div class="welcome-title">¡Bienvenido!</div>
        <img class="welcome-img" src="/Logo-AVRI.png" />
        <div class="welcome-body">¿Cómo puedo ayudar el día de hoy?</div>
      </div>
      <!-- Mensajes existentes -->
      <div *ngFor="let message of messages" class="column">
        <div [ngClass]="{
            'message-user': message.type === 'user',
            'message-system': message.type === 'system'
          }">
          <!-- Avatar para mensajes del sistema -->
          <div [ngClass]="{
              'invisible': message.type === 'user',
              'system-avatar-container': message.type === 'system'
            }">
            <img class="system-avatar" src="/Logo-AVRI.png" alt="avatar" />
          </div>
          {{ message.text }}
        </div>
      </div>
    </div>
  </div>

  <!-- Input para escribir -->
  <div class="chat-input">
    <input
      class="chat-input-box"
      placeholder="Escribe algo al AVRI"
      [(ngModel)]="newMessage"
      (keyup.enter)="addMessage()"
    />
    <div class="chat-send-button" (click)="addMessage()">
      <i class="bi bi-arrow-up" style="color: white"></i>
    </div>
  </div>
</div>

<!-- Opcional: mensaje si no está logueado -->
<div [ngClass]="{ 'right-profiler': !isLoggedIn, invisible: isLoggedIn }">
  <p style="padding: 2rem; text-align: center;">
    Inicia sesión para chatear con el asistente.
  </p>
</div>
