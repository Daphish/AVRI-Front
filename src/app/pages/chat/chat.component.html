<div class="main-container">
    <div class="left">Hola</div>
    <div class="right">
        <div class="chat-container" #chatContainer>
            <div *ngFor="let message of messages" [ngClass]="{'message-user': message.sender === 'user', 'message-system': message.sender === 'system'}">
                {{ message.text }}
            </div>
        </div>
        <div class="chat-input">
            <input class="chat-input-box" placeholder="Escribe algo al AVRI" [(ngModel)]="newMessage" (keyup.enter)="addMessage()"/>
            <div class="chat-send-button" (click)="addMessage()">
                <i class="bi bi-arrow-up" style="color: white;"></i>
            </div>
        </div>
        <div class="white-block"></div>
    </div>
</div>
