<div class="modal-overlay">
  <div class="modal-content">
    <div class="avatar-circle">
      <i class="bi bi-person-fill" style="color: white; font-size: 6rem"></i>
    </div>
    <h2>Iniciar Sesión</h2>

    <label for="email" style="width: 100%">Correo Electrónico</label>
    <input
      type="email"
      id="email"
      placeholder="Ejemplo: usuario@email.com"
      [(ngModel)]="user"
      (keyup.enter)="startSession()"
    />

    <label for="password" style="width: 100%">Contraseña</label>
    <input
      type="password"
      id="password"
      placeholder="********"
      [(ngModel)]="password"
      (keyup.enter)="startSession()"
    />

    <div class="modal-actions">
      <button class="btn login" (click)="startSession()" [disabled]="loggingIn">
        <span *ngIf="!loggingIn">Iniciar Sesión</span>
        <span *ngIf="loggingIn" class="loading-content">
          <span class="spinner"></span>
          Iniciando...
        </span>
      </button>
      
      <button class="btn guest" (click)="continueAsGuest()" [disabled]="loggingIn">
        <span *ngIf="!loggingIn">Continuar como invitado</span>
        <span *ngIf="loggingIn" class="loading-content">
          <span class="spinner"></span>
          Conectando...
        </span>
      </button>
    </div>
  </div>

  <!-- Toast notification -->
  <div *ngIf="showToast" class="toast toast-{{toastType}}">
    <span>{{ toastMessage }}</span>
    <i class="bi bi-x" (click)="showToast = false"></i>
  </div>

</div>
