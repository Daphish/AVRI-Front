<div class="left">
  <!-- ---------- logo ---------- -->
  <div class="top-left">
    <img src="/Logo-AVRI-Alt.png" alt="AVRI Logo" />
    <div class="left-title">Asistente Virtual RI</div>
  </div>

  <!-- ---------- new chat ---------- -->
  <button class="new-chat-button" (click)="viewHome()">
    Nueva conversación +
  </button>

  <!-- ---------- chat list ---------- -->
  <div class="left-chats">
    <!-- Spinner loading sessions -->
    <div *ngIf="loadingSessions" class="loading-sessions">
      <div class="spinner"></div>
      <span>Cargando conversaciones...</span>
    </div>

    <ng-container *ngIf="chats$ | async as chatList">
      <div *ngIf="chatList.length === 0" class="no-chats-message">
        Aún no hay conversaciones
      </div>

      <div
        *ngFor="let chat of chatList"
        class="sidebar-chat"
        (click)="loadMessages(chat.session_id)"
        [ngClass]="{ active: chat.session_id === activeSessionId }"
        tabindex="0"
        (keyup.enter)="loadMessages(chat.session_id)"
        [attr.aria-label]="'Load chat: ' + chat.session_name"
      >
        <span class="chat-name">
          <i class="bi bi-chat-left" style="margin-right: 4px"></i>
          {{ chat.session_name }}
        </span>

        <!-- delete icon -->
        <div class="delete-container">
          <!-- spinner when deleting -->
          <div
            *ngIf="deletingChatId === chat.session_id"
            class="spinner-small"
          ></div>

          <!-- normal icon if not deleting -->
          <i
            *ngIf="deletingChatId !== chat.session_id"
            class="bi bi-trash delete-icon"
            title="Eliminar"
            (click)="deleteChat(chat.session_id)"
          ></i>
        </div>
      </div>
    </ng-container>
  </div>

  <!-- ---------- login / account ---------- -->
  <div class="left-login" *ngIf="isLoggedIn$ | async as logged">
    <button *ngIf="!logged" class="login-button" (click)="openModal()">
      Iniciar sesión
    </button>

    <div *ngIf="logged" class="account-dropdown-container">
      <button class="account-button" (click)="toggleDropdown()">
        <div class="account-circle">
          {{ currentUserInitial$ | async | uppercase }}
        </div>
        {{ currentUserName$ | async }}
        <i class="bi bi-chevron-down dropdown-arrow" [class.rotated]="isDropdownOpen"></i>
      </button>
      
      <!-- Dropdown menu -->
      <div class="dropdown-menu" *ngIf="isDropdownOpen">
        <div class="dropdown-item" (click)="viewProfile()">
          <i class="bi bi-person"></i>
          <span>Perfil</span>
        </div>
        <div class="dropdown-item" (click)="closeSession()">
          <i class="bi bi-box-arrow-right"></i>
          <span>Cerrar sesión</span>
        </div>
      </div>
    </div>
  </div>

  <div class="left-login" *ngIf="!(isLoggedIn$ | async)">
    <button class="login-button" (click)="openModal()">Iniciar sesión</button>
  </div>

  <!-- Toast notification with confirmation buttons -->
  <div *ngIf="showToast" class="toast toast-{{ toastType }}">
    <div class="toast-content">
      <i 
        class="bi"
        [ngClass]="{
          'bi-exclamation-triangle-fill': toastType === 'warning',
          'bi-check-circle-fill': toastType === 'success',
          'bi-x-circle-fill': toastType === 'error'
        }"
      ></i>
      <span>{{ toastMessage }}</span>
    </div>
    
    <!-- Toast notification -->
  <div
    *ngIf="showToast"
    class="toast toast-{{ toastType }}"
    [class.clickable-warning]="toastType === 'warning' && pendingDeleteId"
    (click)="
      toastType === 'warning' && pendingDeleteId ? confirmDelete() : null">
    <span>{{ toastMessage }}</span>
    <i
      class="bi bi-x"
      (click)="
        showToast = false; pendingDeleteId = null; $event.stopPropagation()
      "
    ></i>
  </div>
</div>

<app-login-modal
  *ngIf="isModalOpen"
  (closeModalEvent)="closeModal()"
></app-login-modal>
